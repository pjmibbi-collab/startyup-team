                  <div>
                    <h3 class="text-lg font-extrabold text-slate-900">
                      📋 현재까지 지원 완료한 학생 목록 (${roomApplicants.length}명)
                    </h3>
                    <p class="text-xs text-slate-500 mt-0.5">
                      ${isTeacher
                        ? '선생님은 모든 학생의 지원 내역을 수정하거나 삭제할 수 있습니다.'
                        : '본인이 등록한 지원 카드는 언제든 수정하거나 삭제할 수 있습니다.'}
                    </p>
                  </div>
                </div>

                ${roomApplicants.length === 0 ? `
                  <div class="py-12 text-center border-2 border-dashed border-slate-200 rounded-2xl bg-slate-50/50">
                    <div class="text-3xl mb-2">🙋‍♀️</div>
                    <p class="text-sm font-bold text-slate-700">아직 지원한 학생이 없습니다.</p>
                    <p class="text-xs text-slate-500 mt-1">학생들이 각자의 iPad에서 역량을 선택해 제출하면 이곳에 실시간 표시됩니다.</p>
                  </div>
                ` : `
                  <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 max-h-[580px] overflow-y-auto pr-1">
                    ${roomApplicants.slice().reverse().map((app, revIdx) => {
                      const orderNum = roomApplicants.length - revIdx;
                      const appSkills = getApplicantSkills(app);
                      const isEditing = session.editingApplicantId === app.applicantId;
                      const isAnySkillChanged = appSkills.some(sk => !validSkillSet.has(sk));
                      const isMine = (currentUser && app.ownerUid === currentUser.uid) || session.myApplicantId === app.applicantId;
                      const canManage = isTeacher || isMine;

                      if (isEditing && canManage) {
                        const editEditSet = new Set(session.editingApplicantSkills);
                        const editOptions = [...aggregated.map(a => a.skill)];
                        appSkills.forEach(sk => {
                          if (!editOptions.includes(sk)) editOptions.unshift(sk);
                        });
                        return `
                          <div class="p-3.5 rounded-xl border-2 border-indigo-500 bg-indigo-50/50 space-y-2.5 animate-fade-in">
                            <div class="flex items-center justify-between">
                              <span class="text-xs font-extrabold text-indigo-700">#${orderNum} 지원 정보 수정 (${session.editingApplicantSkills.length}/2개)</span>
                            </div>
                            <input
                              id="edit-app-name-${escapeHtml(app.applicantId)}"
                              data-preserve-focus="true"
                              type="text"
                              value="${escapeHtml(app.name)}"
                              placeholder="학생 이름"
                              class="w-full min-h-[42px] px-3 py-1.5 rounded-lg border border-slate-300 bg-white text-xs sm:text-sm font-bold text-slate-900 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                            />
                            <div class="flex flex-wrap gap-1.5 bg-white p-2.5 rounded-lg border border-slate-200">
                              ${editOptions.map(sk => {
                                const isSel = editEditSet.has(sk);
                                const isDisabled = !isSel && session.editingApplicantSkills.length >= 2;
                                return `
                                  <button
                                    type="button"

      // Determine whether this device can actively pick right now
      const isMyLeaderTurn = !isDraftFinished && totalApplicants > 0 && isLeader && session.teamId === currentTeam.teamId;
      const canPickNow = !isDraftFinished && totalApplicants > 0 && (isTeacher || isMyLeaderTurn);

                              ⏳ ${escapeHtml(currentTeam.name)} 팀장 선택 대기 중
                            </div>
                          `}
                        </div>
                      </div>
                    `;
                  }).join('')}
                </div>
              `}

                  const theme = getTeamTheme(team.teamId);
                  const members = getTeamDraftedMembers(team.teamId);
                  const isPickingNow = !isDraftFinished && totalApplicants > 0 && currentTeam.teamId === team.teamId;
                  const isMyTeam = (isLeader && session.teamId === team.teamId) || (myDraftedTeam && myDraftedTeam.teamId === team.teamId);
                  const currentCount = 1 + members.length;
                  const emptySlotsCount = Math.max(0, targetTeamSize - currentCount);

                  return `
                    <div class="bg-white rounded-2xl border-2 p-4 transition ${

                          ${isPickingNow ? `<span class="px-2 py-0.5 rounded-full bg-indigo-600 text-white text-[10px] font-extrabold animate-pulse">현재 차례</span>` : ''}

                          ${currentCount} / ${targetTeamSize}명

    /**
     * ============================================================================
     * 16. STEP 4 VIEW: Final Team Roster Results, Export & Full Reset
     * ============================================================================
     */
    function renderStep4() {
      const isTeacher = session.role === 'teacher';
      const pickHistory = roomState.draft?.pickHistory || [];
      const unassigned = getAvailableApplicants();

      // Determine user's own teamId so it can be pinned & highlighted at top on iPads
      let myTeamId = null;
      if (session.role === 'leader' && session.teamId) {
        myTeamId = session.teamId;
      } else if (session.role === 'student' && session.myApplicantId) {
        const myPick = pickHistory.find(p => p.applicantId === session.myApplicantId);
        if (myPick) myTeamId = myPick.teamId;
      }

      const orderedTeams = [...roomTeams].sort((a, b) => {
        if (myTeamId) {
          if (a.teamId === myTeamId) return -1;
          if (b.teamId === myTeamId) return 1;
        }
        return (a.teamId || 0) - (b.teamId || 0);
      });

      return `
        <div class="space-y-6 animate-fade-in">
          <!-- Celebration Header -->
          <div class="bg-gradient-to-r from-indigo-600 via-violet-600 to-indigo-700 text-white rounded-3xl p-6 sm:p-8 shadow-md flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4">

              <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-white/15 text-xs font-extrabold">
                <span>🎊 최종 팀 빌딩 완성</span>
                <span>·</span>
                <span>방 코드: ${escapeHtml(roomState.roomCode)}</span>
              </div>
              <h2 class="text-2xl sm:text-3xl font-black tracking-tight">
                창업마켓 최종 팀 구성 결과표

              <p class="text-sm text-indigo-100">
                총 ${roomTeams.length}개 팀 · 배정 인원 ${roomTeams.length + pickHistory.length}명 (팀장 ${roomTeams.length}명 + 선발 팀원 ${pickHistory.length}명)
              </p>
            </div>

            <div class="flex flex-wrap items-center gap-2.5 no-print">
              <button
                type="button"
                onclick="triggerConfetti()"
                class="min-h-[48px] px-4 py-2.5 rounded-xl bg-white/15 hover:bg-white/25 text-white text-xs sm:text-sm font-extrabold transition cursor-pointer"
              >
                🎉 축하 폭죽 다시 터뜨리기
              </button>
              ${isTeacher ? `
                <button
                  type="button"
                  onclick="copyResultsToClipboard()"
                  class="min-h-[48px] px-4 py-2.5 rounded-xl bg-white text-indigo-900 hover:bg-indigo-50 text-xs sm:text-sm font-extrabold shadow-sm transition cursor-pointer"
                >
                  📋 결과 텍스트 복사하기
                </button>
                <button
                  type="button"
                  onclick="downloadResultsCSV()"
                  class="min-h-[48px] px-4 py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 text-xs sm:text-sm font-black shadow-sm transition cursor-pointer"
                >
                  📥 CSV 파일 다운로드
                </button>
              ` : ''}

          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
            ${orderedTeams.map(team => {
              const theme = getTeamTheme(team.teamId);
              const members = getTeamDraftedMembers(team.teamId);
              const isMyTeam = myTeamId === team.teamId;

              return `
                <div class="print-card bg-white rounded-2xl border-2 ${isMyTeam ? 'border-emerald-500 ring-4 ring-emerald-500/15 shadow-md' : `${theme.border} shadow-xs`} overflow-hidden flex flex-col justify-between">
                  <div>
                    <div class="px-5 py-4 ${theme.bg} border-b ${theme.border} flex items-center justify-between gap-2">
                      <div class="flex items-center gap-2 flex-wrap">
                        <span class="px-3 py-1 rounded-xl text-xs font-black ${theme.badge}">${escapeHtml(team.name)}</span>
                        ${isMyTeam ? `<span class="px-2.5 py-0.5 rounded-full bg-emerald-600 text-white text-xs font-black">⭐ 내 소속 팀</span>` : ''}

                      <span class="text-xs font-extrabold ${theme.text}">총 ${1 + members.length}명</span>
                    </div>

                    <div class="p-5 space-y-3">
                      <!-- Leader Row -->
                      <div class="p-3 rounded-xl bg-slate-900 text-white flex items-center justify-between gap-2">
                        <div class="flex items-center gap-2">
                          <span class="text-base">👑</span>
                          <span class="font-extrabold text-sm sm:text-base">${escapeHtml(team.leaderName || '미정')}</span>

                        ${members.length === 0 ? `

                            </div>
                          `;
                        }).join('')}
                      </div>

                  </div>

                  <!-- Team's Requested Competencies Summary Footer -->

                  </span>
                `).join('')}
              </div>
            </div>
          ` : ''}

          <!-- Bottom Navigation & Full Reset Bar -->
          <div class="bg-white rounded-2xl border border-slate-200 p-4 sm:p-5 shadow-sm flex flex-col lg:flex-row items-center justify-between gap-3 no-print">
            ${isTeacher ? `
              <div class="flex flex-wrap items-center gap-2 w-full lg:w-auto">
                <button
                  type="button"
                  onclick="goToStep(3)"
                  class="flex-1 sm:flex-initial min-h-[48px] px-4 py-3 rounded-xl font-extrabold text-xs sm:text-sm text-slate-800 bg-slate-100 hover:bg-slate-200 transition cursor-pointer"
                >
                  ← 3단계(드래프트)로 돌아가 수정하기
                </button>
                <button
                  type="button"
                  onclick="goToStep(2)"
                  class="flex-1 sm:flex-initial min-h-[48px] px-4 py-3 rounded-xl font-bold text-xs sm:text-sm text-slate-600 bg-slate-50 hover:bg-slate-100 border border-slate-200 transition cursor-pointer"
                >
                  ← 2단계(학생 지원) 수정
                </button>
                <button
                  type="button"
                  onclick="goToStep(1)"
                  class="flex-1 sm:flex-initial min-h-[48px] px-4 py-3 rounded-xl font-bold text-xs sm:text-sm text-slate-600 bg-slate-50 hover:bg-slate-100 border border-slate-200 transition cursor-pointer"
                >
                  ← 1단계(팀장 역량) 수정
                </button>
              </div>
            ` : `
              <div class="text-xs sm:text-sm font-semibold text-slate-500">
                모든 팀 구성이 완료되었습니다! 창업마켓 활동을 힘차게 시작해보세요 🚀
              </div>
            `}

            <div class="flex flex-wrap items-center gap-2 w-full lg:w-auto justify-end">
              <button
                type="button"
                onclick="copyResultsToClipboard()"
                class="flex-1 sm:flex-initial min-h-[48px] px-4 py-3 rounded-xl font-bold text-xs sm:text-sm bg-indigo-50 text-indigo-700 hover:bg-indigo-100 transition cursor-pointer"
              >
                📋 텍스트 복사
              </button>
              ${isTeacher ? `
                <button
                  type="button"
                  onclick="downloadResultsCSV()"
                  class="flex-1 sm:flex-initial min-h-[48px] px-4 py-3 rounded-xl font-bold text-xs sm:text-sm bg-emerald-600 text-white hover:bg-emerald-700 transition cursor-pointer"

                </button>

                  type="button"
                  onclick="confirmResetAll()"

    }

    /**
     * ============================================================================
     * 17. Custom Modal, Toast & Confetti Celebration Utilities
     * ============================================================================
     */
    let activeModalConfirmCallback = null;

    function openModal({ title, bodyHtml, confirmText = '확인', cancelText = '취소', confirmClass = 'bg-indigo-600 hover:bg-indigo-700 text-white', hideConfirm = false, onConfirm = null }) {
      const backdrop = document.getElementById('modal-backdrop');
      const box = document.getElementById('modal-box');
      if (!backdrop || !box) return;

      activeModalConfirmCallback = onConfirm;

      box.innerHTML = `
        <h3 class="text-lg sm:text-xl font-black text-slate-900">${title}</h3>
        <div class="text-xs sm:text-sm text-slate-600 mt-2 leading-relaxed">${bodyHtml}</div>
        <div class="flex items-center justify-end gap-2 mt-6">
          <button
            type="button"
            onclick="closeModal()"
            class="min-h-[46px] px-4 py-2.5 rounded-xl text-xs sm:text-sm font-bold text-slate-700 bg-slate-100 hover:bg-slate-200 transition cursor-pointer"
          >
            ${cancelText}
          </button>
          ${!hideConfirm ? `
            <button
              type="button"
              onclick="executeModalConfirm()"
              class="min-h-[46px] px-5 py-2.5 rounded-xl text-xs sm:text-sm font-extrabold transition cursor-pointer ${confirmClass}"
            >
              ${confirmText}
            </button>
          ` : ''}
        </div>
      `;

      backdrop.classList.remove('hidden');
      backdrop.classList.add('flex');
    }

    function closeModal() {
      const backdrop = document.getElementById('modal-backdrop');
      if (!backdrop) return;
      backdrop.classList.add('hidden');
      backdrop.classList.remove('flex');
      activeModalConfirmCallback = null;
    }

    async function executeModalConfirm() {
      const cb = activeModalConfirmCallback;
      closeModal();
      if (typeof cb === 'function') {
        await cb();
      }
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      if (!container) return;

      const styles = {
        success: 'bg-slate-900 text-white border-emerald-500',
        warning: 'bg-amber-950 text-amber-50 border-amber-400',
        info: 'bg-slate-800 text-white border-indigo-400'
      };
      const icons = {
        success: '✅',
        warning: '⚠️',
        info: 'ℹ️'
      };

      const toast = document.createElement('div');
      toast.className = `pointer-events-auto rounded-2xl border-l-4 px-4 py-3.5 shadow-xl flex items-center gap-2.5 text-xs sm:text-sm font-bold animate-pop-in ${styles[type] || styles.info}`;
      toast.innerHTML = `
        <span class="text-base shrink-0">${icons[type] || icons.info}</span>
        <span class="leading-snug">${escapeHtml(message)}</span>
      `;

      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(8px)';
        toast.style.transition = 'all 0.25s ease';
        setTimeout(() => toast.remove(), 260);
      }, 3400);
    }

    function triggerConfetti() {
      const canvas = document.getElementById('confetti-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const colors = ['#4f46e5', '#10b981', '#f59e0b', '#ec4899', '#06b6d4', '#8b5cf6'];
      const particles = Array.from({ length: 95 }, () => ({
        x: Math.random() * canvas.width,
        y: -20 - Math.random() * 200,
        w: 6 + Math.random() * 6,
        h: 8 + Math.random() * 8,
        vx: -2.5 + Math.random() * 5,
        vy: 3 + Math.random() * 4.5,
        rot: Math.random() * 360,
        vRot: -6 + Math.random() * 12,
        color: colors[Math.floor(Math.random() * colors.length)]
      }));

      let frame = 0;
      const maxFrames = 140;

      function animateConfetti() {
        frame++;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          p.rot += p.vRot;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate((p.rot * Math.PI) / 180);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
          ctx.restore();
        });

        if (frame < maxFrames) {
          requestAnimationFrame(animateConfetti);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
      }

      animateConfetti();
    }

    /**
     * ============================================================================
     * 18. Expose Event Handlers to Window & Boot App
     * ============================================================================
     */
    Object.assign(window, {
      session,
      createTeacherRoom,
      showRoomSecurityCodesModal,
      verifyAndEnterLobbyRoom,
      leaveRoomToLobby,
      verifyLeaderPinInput,
      selectRoleInRoom,
      openRoleSwitchModal,
      goToStep,
      openSettingsModal,
      confirmResetAll,
      loadSampleDemoData,
      handleTeamNameInput,
      handleTeamLeaderInput,
      toggleTeamSkillTag,
      removeTeamSkillAtSlot,
      toggleTeamLock,
      unlockAllTeams,
      lockAllCompletedTeams,
      setStep2Sort,
      toggleSkillForApplication,
      handleStudentApply,
      startEditApplicant,
      toggleEditApplicantSkill,
      cancelEditApplicant,
      saveEditApplicant,
      removeApplicant,
      draftApplicant,
      skipCurrentDraftTurn,
      undoLastDraftPick,
      removeDraftedMember,
      confirmResetDraftOnly,
      setDraftMode,
      shuffleDraftOrder,
      setDraftSkillFilter,
      setDraftSearchQuery,
      toggleOnlyRequestedFilter,
      resetDraftFilters,
      copyRoomCodeToClipboard,
      copyResultsToClipboard,
      downloadResultsCSV,
      closeModal,
      executeModalConfirm,
      triggerConfetti
    });

    window.addEventListener('resize', () => {
      const canvas = document.getElementById('confetti-canvas');
      if (canvas) {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
    });

    // Initial render & Firebase connection boot
    renderApp();
    initFirebase();
  </script>
