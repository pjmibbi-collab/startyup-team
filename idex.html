<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>🚀 창업마켓 블라인드 역량 매칭 &amp; 드래프트 (실시간 iPad 연동)</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Pretendard, Noto Sans KR & Inter Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Pretendard', 'Noto Sans KR', 'Inter', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'sans-serif'],
          },
          animation: {
            'fade-in': 'fadeIn 0.25s ease-out',
            'pop-in': 'popIn 0.3s cubic-bezier(0.16, 1, 0.3, 1)',
            'pulse-soft': 'pulseSoft 2.2s infinite',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0', transform: 'translateY(6px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            popIn: {
              '0%': { opacity: '0', transform: 'scale(0.95)' },
              '100%': { opacity: '1', transform: 'scale(1)' },
            },
            pulseSoft: {
              '0%, 100%': { boxShadow: '0 0 0 0 rgba(79, 70, 229, 0.25)' },
              '50%': { boxShadow: '0 0 0 10px rgba(79, 70, 229, 0)' },
            }
          }
        }
      }
    };
  </script>

  <style>
    body {
      font-family: 'Pretendard', 'Noto Sans KR', 'Inter', sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Blind pattern overlay for locked team inputs */
    .blind-pattern {
      background-image: repeating-linear-gradient(
        -45deg,
        #1e293b,
        #1e293b 10px,
        #334155 10px,
        #334155 20px
      );
    }

    /* Confetti canvas overlay */
    #confetti-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 60;
    }

    @media print {
      header, #step-nav-bar, .no-print {
        display: none !important;
      }
      body {
        background: #ffffff !important;
      }
      .print-card {
        break-inside: avoid;
        border: 1px solid #cbd5e1 !important;
        box-shadow: none !important;
      }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-indigo-100 selection:text-indigo-900">

  <!-- Confetti Canvas for Celebrations -->
  <canvas id="confetti-canvas"></canvas>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none px-4 sm:px-0"></div>

  <!-- Custom Modal Container (Replaces native alert/confirm) -->
  <div id="modal-backdrop" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-50 hidden items-center justify-center p-4 animate-fade-in">
    <div id="modal-box" class="bg-white rounded-2xl shadow-2xl border border-slate-200 max-w-md w-full p-6 animate-pop-in">
      <!-- Dynamic Modal Content -->
    </div>
  </div>

  <!-- Top Header -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-xs">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3">
      <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-3">
        <!-- App Title & Live Connection Badge -->
        <div class="flex flex-wrap items-center justify-between gap-3">
          <div class="flex items-center gap-3">
            <div class="w-11 h-11 rounded-2xl bg-gradient-to-br from-indigo-600 to-violet-600 text-white flex items-center justify-center text-2xl shadow-md shadow-indigo-200 shrink-0">
              🚀
            </div>
            <div>
              <div class="flex flex-wrap items-center gap-2">
                <h1 class="text-base sm:text-xl font-extrabold tracking-tight text-slate-900 leading-tight">
                  창업마켓 블라인드 역량 매칭 &amp; 드래프트
                </h1>
                <span id="connection-badge" class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-extrabold bg-slate-100 text-slate-600 border border-slate-200">
                  ⏳ 서버 연결 중...
                </span>
              </div>
              <p id="header-summary-text" class="text-xs sm:text-sm text-slate-500 font-medium mt-0.5">
                여러 대의 아이패드에서 4자리 방 코드로 동시에 실시간 참여할 수 있습니다
              </p>
            </div>
          </div>
        </div>

        <!-- Utility Action Buttons (Contextual to Lobby vs Room) -->
        <div id="header-actions" class="flex flex-wrap items-center gap-2">
          <!-- Dynamically populated -->
        </div>
      </div>
    </div>

    <!-- 4-Step Progress Stepper Navigation (Shown when inside a room) -->
    <nav id="step-nav-bar" class="bg-slate-50/95 border-t border-slate-200/80 hidden">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-2.5 overflow-x-auto no-scrollbar">
        <ol id="stepper-container" class="flex items-center justify-between min-w-[640px] gap-2">
          <!-- Rendered dynamically -->
        </ol>
      </div>
    </nav>
  </header>

  <!-- Main Workspace Area -->
  <main id="app-main" class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8">
    <!-- Dynamic Views Rendered Here -->
  </main>

  <!-- Subtle Footer -->
  <footer class="border-t border-slate-200 bg-white py-4 mt-auto no-print">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-2 text-xs text-slate-400">
      <span>창업마켓 iPad 실시간 협업 팀 빌딩 웹앱 · 모든 데이터는 클라우드로 실시간 동기화됩니다.</span>
      <span id="footer-stats" class="font-semibold text-slate-500"></span>
    </div>
  </footer>

  <!-- Firebase SDKs & Real-Time Multi-Device Application Logic -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import {
      getAuth,
      signInAnonymously,
      signInWithCustomToken,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import {
      getFirestore,
      doc,
      getDoc,
      setDoc,
      updateDoc,
      deleteDoc,
      onSnapshot,
      collection
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    /**
     * ============================================================================
     * 1. Firebase Initialization & Mandatory Auth Guard (RULE 1, 2, 3 Compliant)
     * ============================================================================
     */
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
    let db = null;
    let auth = null;
    let currentUser = null;
    let connectionStatus = 'connecting'; // 'connecting' | 'ready' | 'error'

    // Collection names under /artifacts/{appId}/public/data/{collectionName}
    const COL_ROOMS = 'startup_rooms';
    const COL_TEAMS = 'startup_room_teams';
    const COL_APPLICANTS = 'startup_room_applicants';

    function getRoomDocRef(roomCode) {
      return doc(db, 'artifacts', appId, 'public', 'data', COL_ROOMS, String(roomCode));
    }
    function getTeamsColRef() {
      return collection(db, 'artifacts', appId, 'public', 'data', COL_TEAMS);
    }
    function getTeamDocRef(roomCode, teamId) {
      return doc(db, 'artifacts', appId, 'public', 'data', COL_TEAMS, `${roomCode}_team_${teamId}`);
    }
    function getApplicantsColRef() {
      return collection(db, 'artifacts', appId, 'public', 'data', COL_APPLICANTS);
    }
    function getApplicantDocRef(roomCode, applicantId) {
      return doc(db, 'artifacts', appId, 'public', 'data', COL_APPLICANTS, `${roomCode}_app_${applicantId}`);
    }

    /**
     * ============================================================================
     * 2. In-Memory Real-Time State & Device Session State (No localStorage)
     * ============================================================================
     */
    const RECOMMENDED_SKILLS = [
      '협업능력',
      '마케팅능력',
      '아이디어',
      '제작능력',
      '홍보능력',
      '디자인감각',
      '칭찬능력',
      '기획력',
      '판매/영업',
      '회계/정산',
      '소통/리더십'
    ];

    // Device-local session (not stored in localStorage)
    const session = {
      roomCode: null,        // e.g., "3842"
      pendingRoomCode: null, // Verified room code awaiting role selection
      role: null,            // 'teacher' | 'leader' | 'student'
      teamId: null,          // 1..N when role === 'leader'
      myApplicantId: null,   // applicantId submitted on this iPad
      lobbyInputCode: '',
      leaderPinInput: '',
      leaderPinVerified: false,
      selectedApplySkills: [], // Up to 2 competencies selected by student
      editingApplicantId: null,
      editingApplicantSkills: [],
      draftSearchQuery: '',
      wasMyTurn: false,
      celebratedDrafted: false,
      celebratedStep4: false
    };

    // Synced Firestore room state
    let roomState = null;       // Document data from startup_rooms/{roomCode}
    let roomTeams = [];         // Filtered & sorted documents from startup_room_teams
    let roomApplicants = [];    // Filtered & sorted documents from startup_room_applicants

    // Active Firestore listeners to unsubscribe cleanly when leaving/switching rooms
    let unsubRoom = null;
    let unsubTeams = null;
    let unsubApplicants = null;

    // Debounce timers for smooth iPad typing without losing focus
    const debounceTimers = {};

    async function initFirebase() {
      try {
        if (typeof __firebase_config === 'undefined' || !__firebase_config) {
          connectionStatus = 'error';
          renderApp();
          return;
        }
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        db = getFirestore(app);
        auth = getAuth(app);

        // RULE 3: Authenticate FIRST before any Firestore operation
        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          await signInWithCustomToken(auth, __initial_auth_token);
        } else {
          await signInAnonymously(auth);
        }

        currentUser = auth.currentUser;
        if (!currentUser) {
          await new Promise((resolve) => {
            const unsub = onAuthStateChanged(auth, (u) => {
              if (u) {
                currentUser = u;
                unsub();
                resolve();
              }
            });
          });
        }

        connectionStatus = 'ready';
        renderApp();
      } catch (err) {
        console.error('Firebase initialization failed:', err);
        connectionStatus = 'error';
        renderApp();
      }
    }

    /**
     * ============================================================================
     * 3. Room Creation, Joining & Real-Time Firestore Subscription
     * ============================================================================
     */
    function generate4DigitCode() {
      return String(Math.floor(1000 + Math.random() * 9000));
    }

    function generateDistinctPins() {
      const teacherPin = generate4DigitCode();
      let leaderPin = generate4DigitCode();
      while (leaderPin === teacherPin) {
        leaderPin = generate4DigitCode();
      }
      return { teacherPin, leaderPin };
    }

    async function createTeacherRoom() {
      if (!db || !currentUser) {
        showToast('서버에 연결 중입니다. 잠시 후 다시 눌러주세요.', 'warning');
        return;
      }

      try {
        // Pick a collision-free 4-digit room code
        let code = generate4DigitCode();
        for (let attempt = 0; attempt < 6; attempt++) {
          const snap = await getDoc(getRoomDocRef(code));
          if (!snap.exists()) break;
          code = generate4DigitCode();
        }

        const { teacherPin, leaderPin } = generateDistinctPins();
        const teamCount = 6;
        const skillsPerTeam = 4;
        const totalStudents = 30;
        const now = Date.now();

        const initialRoom = {
          roomCode: code,
          teacherPin,
          leaderPin,
          hostUid: currentUser.uid,
          currentStep: 1,
          settings: {
            teamCount,
            skillsPerTeam,
            totalStudents
          },
          step2SortBy: 'count',
          draft: {
            mode: 'snake',
            order: [1, 2, 3, 4, 5, 6],
            turnIndex: 0,
            consecutiveSkips: 0,
            pickHistory: [],
            actionLog: [],
            skillFilter: 'ALL',
            onlyRequestedFilter: false
          },
          createdAt: now,
          updatedAt: now
        };

        await setDoc(getRoomDocRef(code), initialRoom);

        // Create 6 independent team documents so 6 leaders never race on writes
        const teamPromises = [];
        for (let i = 1; i <= teamCount; i++) {
          teamPromises.push(
            setDoc(getTeamDocRef(code, i), {
              roomCode: code,
              teamId: i,
              name: `${i}팀`,
              leaderName: '',
              leaderUid: '',
              skills: Array.from({ length: skillsPerTeam }, () => ''),
              locked: false
            })
          );
        }
        await Promise.all(teamPromises);

        session.role = 'teacher';
        session.teamId = null;
        session.pendingRoomCode = null;
        subscribeToRoom(code);

        // Show Teacher Access Codes Modal immediately on creation
        setTimeout(() => showRoomSecurityCodesModal(true), 150);
      } catch (err) {
        console.error('Error creating room:', err);
        showToast('수업 방 생성 중 오류가 발생했습니다. 다시 시도해주세요.', 'warning');
      }
    }

    function showRoomSecurityCodesModal(isNewRoom = false) {
      if (!roomState) return;
      openModal({
        title: isNewRoom ? '🎉 수업 방 생성 완료! 접속 코드 안내' : '🔑 수업 방 접속 코드 및 보안 비밀번호',
        bodyHtml: `
          <div class="space-y-3.5 mt-2">
            <p class="text-xs sm:text-sm text-slate-600">
              학생들이 무단으로 선생님이나 팀장 화면으로 전환하지 못하도록 역할별 인증 코드가 분리되어 있습니다.
            </p>

            <div class="p-3.5 rounded-2xl bg-emerald-50 border border-emerald-200 flex items-center justify-between">
              <div>
                <div class="text-xs font-extrabold text-emerald-800">1. 전체 학생 안내용 방 코드 (칠판 공개)</div>
                <div class="text-[11px] text-emerald-700 mt-0.5">모든 학생·팀장 iPad 첫 화면 입력용</div>
              </div>
              <span class="text-2xl font-black tracking-widest text-emerald-950">${escapeHtml(roomState.roomCode)}</span>
            </div>

            <div class="p-3.5 rounded-2xl bg-indigo-50 border border-indigo-200 flex items-center justify-between">
              <div>
                <div class="text-xs font-extrabold text-indigo-800">2. 팀장 전용 인증 코드 (6명 팀장에게만 안내)</div>
                <div class="text-[11px] text-indigo-700 mt-0.5">이 코드를 입력해야 팀장 화면 입장 가능</div>
              </div>
              <span class="text-2xl font-black tracking-widest text-indigo-950">${escapeHtml(roomState.leaderPin || '1234')}</span>
            </div>

            <div class="p-3.5 rounded-2xl bg-rose-50 border border-rose-200 flex items-center justify-between">
              <div>
                <div class="text-xs font-extrabold text-rose-800">3. 선생님 전용 비밀번호 (선생님만 보관)</div>
                <div class="text-[11px] text-rose-700 mt-0.5">선생님 화면 전환·재접속 시 필수 입력</div>
              </div>
              <span class="text-2xl font-black tracking-widest text-rose-950">${escapeHtml(roomState.teacherPin || '0000')}</span>
            </div>
          </div>
        `,
        confirmText: '코드 일괄 복사하기',
        cancelText: '확인 (닫기)',
        onConfirm: () => {
          const summary = `[창업마켓 수업 접속 정보]\n• 전체 방 코드: ${roomState.roomCode}\n• 팀장 인증 코드: ${roomState.leaderPin || '1234'}\n• 선생님 비밀번호: ${roomState.teacherPin || '0000'}`;
          copyTextFallback(summary, '방 코드와 인증 비밀번호가 클립보드에 복사되었습니다!');
        }
      });
    }

    async function verifyAndEnterLobbyRoom(inputCode, asTeacher = false) {
      if (!db || !currentUser) {
        showToast('서버에 연결 중입니다. 잠시 후 다시 눌러주세요.', 'warning');
        return;
      }

      const cleanCode = String(inputCode || session.lobbyInputCode || '').replace(/\D/g, '').slice(0, 4);
      if (cleanCode.length !== 4) {
        showToast('칠판에 표시된 4자리 숫자 방 코드를 입력해주세요.', 'warning');
        return;
      }

      try {
        const snap = await getDoc(getRoomDocRef(cleanCode));
        if (!snap.exists()) {
          showToast(`방 코드 [${cleanCode}]를 찾을 수 없습니다. 번호를 다시 확인해주세요.`, 'warning');
          return;
        }

        const roomData = snap.data();

        if (asTeacher) {
          // Require Teacher PIN before granting Teacher Host access
          openModal({
            title: '🔐 선생님 전용 비밀번호 확인',
            bodyHtml: `
              <div class="space-y-3 mt-2">
                <p class="text-xs sm:text-sm text-slate-600">
                  방 코드 <strong>[${escapeHtml(cleanCode)}]</strong>의 선생님(진행자) 화면으로 입장하려면 <strong>4자리 선생님 비밀번호</strong>를 입력하세요.
                </p>
                <input
                  id="teacher-pin-verify-input"
                  type="password"
                  inputmode="numeric"
                  maxlength="4"
                  placeholder="••••"
                  class="w-full min-h-[54px] text-center text-2xl font-black tracking-[0.4em] rounded-xl border-2 border-indigo-300 bg-slate-50 focus:bg-white text-slate-900 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                />
              </div>
            `,
            confirmText: '선생님 화면 입장',
            onConfirm: () => {
              const entered = (document.getElementById('teacher-pin-verify-input')?.value || '').trim();
              const expected = String(roomData.teacherPin || '0000');
              if (entered !== expected) {
                showToast('선생님 비밀번호가 일치하지 않습니다. 학생이라면 일반 입장을 이용해주세요.', 'warning');
                return;
              }
              session.role = 'teacher';
              session.teamId = null;
              session.pendingRoomCode = null;
              subscribeToRoom(cleanCode);
              showToast(`선생님(진행자) 화면으로 [${cleanCode}] 방에 입장했습니다.`, 'success');
            }
          });
          setTimeout(() => document.getElementById('teacher-pin-verify-input')?.focus(), 80);
        } else {
          session.pendingRoomCode = cleanCode;
          session.leaderPinInput = '';
          session.leaderPinVerified = false;
          subscribeToRoom(cleanCode);
        }
      } catch (err) {
        console.error('Error verifying room code:', err);
        showToast('방 입장 확인 중 오류가 발생했습니다.', 'warning');
      }
    }

    function subscribeToRoom(roomCode) {
      unsubscribeRoomListeners();

      session.roomCode = roomCode;
      session.wasMyTurn = false;
      session.celebratedDrafted = false;
      session.celebratedStep4 = false;

      // 1. Listen to Room Metadata Document
      unsubRoom = onSnapshot(
        getRoomDocRef(roomCode),
        (docSnap) => {
          if (!docSnap.exists()) {
            showToast('수업 방이 종료되었거나 존재하지 않습니다.', 'warning');
            leaveRoomToLobby();
            return;
          }
          const prevStep = roomState?.currentStep;
          roomState = docSnap.data();

          // Celebrate on Step 4 entry
          if (roomState.currentStep === 4 && prevStep !== 4 && !session.celebratedStep4) {
            session.celebratedStep4 = true;
            setTimeout(() => triggerConfetti(), 120);
          }
          if (roomState.currentStep !== 4) {
            session.celebratedStep4 = false;
          }

          checkTurnAndDraftNotifications();
          renderApp();
        },
        (error) => {
          console.error('Room snapshot error:', error);
          showToast('실시간 방 동기화 중 연결 지연이 발생했습니다.', 'warning');
        }
      );

      // 2. Listen to Teams Collection (RULE 2: fetch collection, filter & sort in JS)
      unsubTeams = onSnapshot(
        getTeamsColRef(),
        (querySnap) => {
          const list = [];
          querySnap.forEach((d) => {
            const data = d.data();
            if (data && data.roomCode === roomCode) {
              list.push(data);
            }
          });
          list.sort((a, b) => (a.teamId || 0) - (b.teamId || 0));
          roomTeams = list;

          checkTurnAndDraftNotifications();
          renderApp();
        },
        (error) => {
          console.error('Teams snapshot error:', error);
        }
      );

      // 3. Listen to Applicants Collection (RULE 2: fetch collection, filter & sort in JS)
      unsubApplicants = onSnapshot(
        getApplicantsColRef(),
        (querySnap) => {
          const list = [];
          querySnap.forEach((d) => {
            const data = d.data();
            if (data && data.roomCode === roomCode) {
              list.push(data);
            }
          });
          list.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
          roomApplicants = list;

          // Auto-recover myApplicantId on this iPad by matching ownerUid
          if (currentUser && !session.myApplicantId) {
            const mine = roomApplicants.find(a => a.ownerUid === currentUser.uid);
            if (mine) {
              session.myApplicantId = mine.applicantId;
            }
          } else if (session.myApplicantId && !roomApplicants.some(a => a.applicantId === session.myApplicantId)) {
            session.myApplicantId = null;
          }

          checkTurnAndDraftNotifications();
          renderApp();
        },
        (error) => {
          console.error('Applicants snapshot error:', error);
        }
      );

      renderApp();
    }

      if (unsubRoom) { unsubRoom(); unsubRoom = null; }
      if (unsubTeams) { unsubTeams(); unsubTeams = null; }

    /**
     * ============================================================================
     * 4. Turn Sound Chime & Student Draft Celebration Check
     * ============================================================================
     */
    function playGentleTurnChime() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const now = ctx.currentTime;

        [523.25, 659.25].forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + i * 0.14);
          gain.gain.setValueAtTime(0.001, now + i * 0.14);
          gain.gain.exponentialRampToValueAtTime(0.12, now + i * 0.14 + 0.03);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.14 + 0.45);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + i * 0.14);
          osc.stop(now + i * 0.14 + 0.46);
        });
      } catch (e) {
        // Ignore audio autoplay block if user hasn't tapped recently
      }
    }

    function checkTurnAndDraftNotifications() {
      if (!roomState || roomTeams.length === 0) return;

      // 1. Check if it just became this team leader's draft turn in Step 3
      if (roomState.currentStep === 3 && session.role === 'leader' && session.teamId) {
        const available = getAvailableApplicants();
        const isFinished = roomApplicants.length > 0 && available.length === 0;
        const currentTeam = getCurrentDraftTeam();
        const isMyTurnNow = !isFinished && roomApplicants.length > 0 && currentTeam && currentTeam.teamId === session.teamId;

        if (isMyTurnNow && !session.wasMyTurn) {
          playGentleTurnChime();
          showToast('🚨 지금 우리 팀 지명 차례입니다! 지원자를 선택해주세요.', 'success');
        }
        session.wasMyTurn = isMyTurnNow;
      } else {
        session.wasMyTurn = false;
      }

      // 2. Check if a student on this iPad just got drafted!
      if (session.role === 'student' && session.myApplicantId) {
        const pickHistory = roomState.draft?.pickHistory || [];
        const myPick = pickHistory.find(p => p.applicantId === session.myApplicantId);
        if (myPick && !session.celebratedDrafted) {
          session.celebratedDrafted = true;
          const draftedTeam = roomTeams.find(t => t.teamId === myPick.teamId);
          setTimeout(() => triggerConfetti(), 120);
          showToast(`🎉 축하합니다! [${draftedTeam ? draftedTeam.name : myPick.teamId + '팀'}]에 선발되었습니다!`, 'success');
        } else if (!myPick) {
          session.celebratedDrafted = false;
        }
      }
    }

    /**
     * ============================================================================
     * 5. Core Domain Helpers & Real-Time Firestore Mutations
     * ============================================================================
     */
    function normalizeSkill(raw) {
      if (!raw || typeof raw !== 'string') return '';
      return raw.trim().replace(/\s+/g, ' ');
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    const TEAM_COLORS = [
      { bg: 'bg-indigo-50', border: 'border-indigo-300', badge: 'bg-indigo-600 text-white', text: 'text-indigo-700', ring: 'ring-indigo-500' },
      { bg: 'bg-emerald-50', border: 'border-emerald-300', badge: 'bg-emerald-600 text-white', text: 'text-emerald-700', ring: 'ring-emerald-500' },
      { bg: 'bg-amber-50', border: 'border-amber-300', badge: 'bg-amber-500 text-white', text: 'text-amber-800', ring: 'ring-amber-500' },
      { bg: 'bg-rose-50', border: 'border-rose-300', badge: 'bg-rose-600 text-white', text: 'text-rose-700', ring: 'ring-rose-500' },
      { bg: 'bg-sky-50', border: 'border-sky-300', badge: 'bg-sky-600 text-white', text: 'text-sky-700', ring: 'ring-sky-500' },
      { bg: 'bg-purple-50', border: 'border-purple-300', badge: 'bg-purple-600 text-white', text: 'text-purple-700', ring: 'ring-purple-500' },
      { bg: 'bg-teal-50', border: 'border-teal-300', badge: 'bg-teal-600 text-white', text: 'text-teal-700', ring: 'ring-teal-500' },
      { bg: 'bg-orange-50', border: 'border-orange-300', badge: 'bg-orange-600 text-white', text: 'text-orange-700', ring: 'ring-orange-500' }
    ];

    function getTeamTheme(teamId) {
      return TEAM_COLORS[((teamId || 1) - 1) % TEAM_COLORS.length];
    }

    function isStep1Complete() {
      if (roomTeams.length === 0) return false;
      return roomTeams.every(t =>
        (t.leaderName || '').trim().length > 0 &&
        Array.isArray(t.skills) &&
        t.skills.every(s => normalizeSkill(s).length > 0)
      );
    }

    // Helper: supports both 2-skill array `app.skills` and legacy single `app.skill`
    function getApplicantSkills(app) {
      if (!app) return [];
      if (Array.isArray(app.skills) && app.skills.length > 0) {
        return app.skills.map(s => normalizeSkill(s)).filter(Boolean);
      }
      const single = normalizeSkill(app.skill);
      return single ? [single] : [];
    }

    function formatApplicantSkillsText(app) {
      return getApplicantSkills(app).join(' · ');
    }

    function getAggregatedSkills() {
      const map = new Map();
      roomTeams.forEach(team => {
        (team.skills || []).forEach(rawSkill => {
          const skill = normalizeSkill(rawSkill);
          if (!skill) return;
          if (!map.has(skill)) {
            map.set(skill, { skill, demand: 0, applicantCount: 0 });
          }
          map.get(skill).demand += 1;
        });
      });

      roomApplicants.forEach(app => {
        const appSkills = getApplicantSkills(app);
        appSkills.forEach(skill => {
          if (map.has(skill)) {
            map.get(skill).applicantCount += 1;
          }
        });
      });

      const list = Array.from(map.values());
      const sortBy = roomState?.step2SortBy || 'count';
      if (sortBy === 'alpha') {
        list.sort((a, b) => a.skill.localeCompare(b.skill, 'ko'));
      } else {
        list.sort((a, b) => {
          if (b.demand !== a.demand) return b.demand - a.demand;
          return a.skill.localeCompare(b.skill, 'ko');
        });
      }
      return list;
    }

    function getCurrentDraftTurnIndex() {
      if (!roomState || !roomState.draft) return 0;
      if (typeof roomState.draft.turnIndex === 'number') {
        return roomState.draft.turnIndex;
      }
      return (roomState.draft.pickHistory || []).length;
    }

    function getTeamIdAtPickIndex(pickIndex) {
      if (!roomState || roomTeams.length === 0) return 1;
      const validIds = new Set(roomTeams.map(t => t.teamId));
      let order = (roomState.draft?.order || []).filter(id => validIds.has(id));
      roomTeams.forEach(t => {
        if (!order.includes(t.teamId)) order.push(t.teamId);
      });
      const n = order.length;
      if (n === 0) return 1;

      const round = Math.floor(pickIndex / n);
      const posInRound = pickIndex % n;
      if ((roomState.draft?.mode || 'snake') === 'snake' && round % 2 === 1) {
        return order[n - 1 - posInRound];
      }
      return order[posInRound];
    }

    function getCurrentDraftTeam() {
      const turnIdx = getCurrentDraftTurnIndex();
      const teamId = getTeamIdAtPickIndex(turnIdx);
      return roomTeams.find(t => t.teamId === teamId) || roomTeams[0] || { teamId: 1, name: '1팀', leaderName: '', skills: [] };
    }

    function getAvailableApplicants() {
      const pickedIds = new Set((roomState?.draft?.pickHistory || []).map(p => p.applicantId));
      return roomApplicants.filter(a => !pickedIds.has(a.applicantId));
    }

    function getTeamDraftedMembers(teamId) {
      const history = roomState?.draft?.pickHistory || [];
      return history
        .filter(p => p.teamId === teamId)
        .map(p => roomApplicants.find(a => a.applicantId === p.applicantId))
        .filter(Boolean);
    }

    /**
     * ============================================================================
     * 6. Teacher Step Control, Settings, Demo Data & Full Reset (Firestore)
     * ============================================================================
     */
    async function goToStep(stepNum) {
      if (!db || !currentUser || !roomState) return;
      if (stepNum < 1 || stepNum > 4) return;

      try {
        // Automatically lock completed teams when teacher advances from Step 1 to Step 2
        if (roomState.currentStep === 1 && stepNum === 2) {
          const lockPromises = roomTeams
            .filter(t => !t.locked && (t.leaderName || '').trim() && (t.skills || []).every(s => normalizeSkill(s)))
            .map(t =>
              updateDoc(getTeamDocRef(roomState.roomCode, t.teamId), {
                skills: t.skills.map(s => normalizeSkill(s)),
                locked: true
              })
            );
          if (lockPromises.length > 0) {
            await Promise.all(lockPromises);
          }
        }

        session.editingApplicantId = null;
        await updateDoc(getRoomDocRef(roomState.roomCode), {
          currentStep: stepNum,
          updatedAt: Date.now()
        });
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } catch (err) {
        console.error('Error changing step:', err);
        showToast('단계 전환 중 오류가 발생했습니다.', 'warning');
      }
    }

    function openSettingsModal() {
      if (!roomState) return;
      const currentTeamCount = roomState.settings?.teamCount || 6;
      const currentSkillsPerTeam = roomState.settings?.skillsPerTeam || 4;
      const currentTotalStudents = roomState.settings?.totalStudents || 30;

      openModal({
        title: '⚙️ 학급 인원 및 팀 설정',
        bodyHtml: `
          <div class="space-y-4 mt-2">
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1.5">창업마켓 팀 수 (2~10팀, 기본 6팀)</label>
              <input id="setting-team-count" type="number" min="2" max="10" value="${currentTeamCount}"
                class="w-full min-h-[48px] px-3.5 py-2.5 rounded-xl border border-slate-300 text-slate-900 font-bold focus:outline-none focus:ring-2 focus:ring-indigo-500" />
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1.5">팀당 제시할 필요 역량 수 (2~6개, 기본 4개)</label>
              <input id="setting-skills-per-team" type="number" min="2" max="6" value="${currentSkillsPerTeam}"
                class="w-full min-h-[48px] px-3.5 py-2.5 rounded-xl border border-slate-300 text-slate-900 font-bold focus:outline-none focus:ring-2 focus:ring-indigo-500" />
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1.5">학급 총 학생 수 (기본 30명 · 팀당 약 5명)</label>
              <input id="setting-total-students" type="number" min="4" max="60" value="${currentTotalStudents}"
                class="w-full min-h-[48px] px-3.5 py-2.5 rounded-xl border border-slate-300 text-slate-900 font-bold focus:outline-none focus:ring-2 focus:ring-indigo-500" />
              <p class="text-xs text-slate-400 mt-1">총 인원에서 팀장 수를 제외한 인원이 팀원 지원 대상이 됩니다.</p>
            </div>
          </div>
        `,
        confirmText: '설정 저장',
        onConfirm: async () => {
          if (!db || !currentUser || !roomState) return;
          const newTeamCount = Math.max(2, Math.min(10, parseInt(document.getElementById('setting-team-count').value, 10) || 6));
          const newSkillsPerTeam = Math.max(2, Math.min(6, parseInt(document.getElementById('setting-skills-per-team').value, 10) || 4));
          const newTotalStudents = Math.max(newTeamCount, Math.min(60, parseInt(document.getElementById('setting-total-students').value, 10) || 30));
          const code = roomState.roomCode;

          try {
            const ops = [];
            for (let i = 1; i <= newTeamCount; i++) {
              const existing = roomTeams.find(t => t.teamId === i);
              const nextSkills = Array.from({ length: newSkillsPerTeam }, (_, idx) => existing?.skills?.[idx] || '');
              ops.push(
                setDoc(getTeamDocRef(code, i), {
                  roomCode: code,
                  teamId: i,
                  name: existing?.name || `${i}팀`,
                  leaderName: existing?.leaderName || '',
                  leaderUid: existing?.leaderUid || '',
                  skills: nextSkills,
                  locked: existing?.locked || false
                })
              );
            }
            // Delete extra team docs if teamCount decreased
            roomTeams
              .filter(t => t.teamId > newTeamCount)
              .forEach(t => ops.push(deleteDoc(getTeamDocRef(code, t.teamId))));

            const newOrder = Array.from({ length: newTeamCount }, (_, idx) => idx + 1);
            const filteredHistory = (roomState.draft?.pickHistory || []).filter(p => p.teamId <= newTeamCount);

            ops.push(
              updateDoc(getRoomDocRef(code), {
                settings: {
                  teamCount: newTeamCount,
                  skillsPerTeam: newSkillsPerTeam,
                  totalStudents: newTotalStudents
                },
                'draft.order': newOrder,
                'draft.pickHistory': filteredHistory,
                updatedAt: Date.now()
              })
            );

            await Promise.all(ops);
            showToast(`${newTeamCount}개 팀(역량 ${newSkillsPerTeam}개), 총 ${newTotalStudents}명 기준으로 설정되었습니다.`, 'success');
          } catch (err) {
            console.error('Settings update error:', err);
            showToast('설정 저장 중 오류가 발생했습니다.', 'warning');
          }
        }
      });
    }

    function confirmResetAll() {
      if (!roomState) return;

    /**
     * ============================================================================
     * 7. Step 1 Actions (Tag-Only Competency Selection & Blind Lock)

    function queueTeamFieldSync(teamId) {
      if (!db || !currentUser || !roomState) return;
      const key = `team_${teamId}`;
      if (debounceTimers[key]) clearTimeout(debounceTimers[key]);

      debounceTimers[key] = setTimeout(async () => {
        const team = roomTeams.find(t => t.teamId === teamId);
        if (!team || !roomState) return;
        try {
          await updateDoc(getTeamDocRef(roomState.roomCode, teamId), {
            name: team.name,
            leaderName: team.leaderName,
            leaderUid: session.role === 'leader' ? currentUser.uid : (team.leaderUid || ''),
            skills: [...team.skills]
          });
        } catch (err) {
          console.error('Debounced team sync error:', err);
        }
      }, 350);
    }

    function handleTeamNameInput(teamId, value) {
      const team = roomTeams.find(t => t.teamId === teamId);
      if (!team) return;
      team.name = value;
      queueTeamFieldSync(teamId);
    }

    function handleTeamLeaderInput(teamId, value) {
      const team = roomTeams.find(t => t.teamId === teamId);
      if (!team) return;
      team.leaderName = value;
      queueTeamFieldSync(teamId);
      // Refresh lock button readiness state smoothly without stealing input focus
      const lockBtn = document.getElementById(`team-${teamId}-lock-btn`);
      if (lockBtn) {
        const skillsPerTeam = roomState?.settings?.skillsPerTeam || 4;
        const selectedCount = (team.skills || []).map(s => normalizeSkill(s)).filter(Boolean).length;
        const isReady = value.trim().length > 0 && selectedCount >= skillsPerTeam;
        lockBtn.disabled = !isReady;
        lockBtn.className = isReady
          ? 'w-full min-h-[50px] py-3 px-4 rounded-xl bg-slate-900 hover:bg-indigo-600 text-white text-xs sm:text-sm font-extrabold transition flex items-center justify-center gap-1.5 shadow-xs active:scale-[0.99] cursor-pointer'
          : 'w-full min-h-[50px] py-3 px-4 rounded-xl bg-slate-200 text-slate-400 text-xs sm:text-sm font-extrabold transition flex items-center justify-center gap-1.5 cursor-not-allowed';
      }
    }

    async function toggleTeamSkillTag(teamId, rawSkill) {
      if (!db || !currentUser || !roomState) return;
      const team = roomTeams.find(t => t.teamId === teamId);
      if (!team) return;

      if (team.locked) {
        showToast(`${team.name}은(는) 블라인드 처리 완료 상태입니다. 수정하려면 [수정하기 (잠금 해제)]를 눌러주세요.`, 'warning');
        return;
      }

      const skill = normalizeSkill(rawSkill);
      if (!skill) return;

      const skillsPerTeam = roomState.settings?.skillsPerTeam || 4;
      const currentSelected = (team.skills || []).map(s => normalizeSkill(s)).filter(Boolean);
      const existingIdx = currentSelected.indexOf(skill);

      let nextSelected = [];
      if (existingIdx !== -1) {
        // Toggle OFF: remove selected tag and compact remaining tags
        nextSelected = currentSelected.filter((_, idx) => idx !== existingIdx);
      } else {
        // Toggle ON: prevent exceeding skillsPerTeam (4)
        if (currentSelected.length >= skillsPerTeam) {
          showToast(`이미 ${skillsPerTeam}가지 역량을 모두 선택했습니다. 변경하려면 선택된 태그를 먼저 눌러 해제하세요.`, 'warning');
          return;
        }
        nextSelected = [...currentSelected, skill];
      }

      const paddedSkills = Array.from({ length: skillsPerTeam }, (_, idx) => nextSelected[idx] || '');
      team.skills = paddedSkills;
      renderApp();

      try {
        await updateDoc(getTeamDocRef(roomState.roomCode, teamId), {
          skills: paddedSkills,
          leaderUid: session.role === 'leader' ? currentUser.uid : (team.leaderUid || '')
        });
      } catch (err) {
        console.error('Tag toggle sync error:', err);
        showToast('역량 태그 저장 중 오류가 발생했습니다.', 'warning');
      }
    }

    async function removeTeamSkillAtSlot(teamId, slotIdx) {
      const team = roomTeams.find(t => t.teamId === teamId);
      if (!team || team.locked) return;
      const targetSkill = normalizeSkill(team.skills?.[slotIdx]);
      if (!targetSkill) return;
      await toggleTeamSkillTag(teamId, targetSkill);
    }

    async function toggleTeamLock(teamId, shouldLock) {
      if (!db || !currentUser || !roomState) return;
      const team = roomTeams.find(t => t.teamId === teamId);
      if (!team) return;

      // Flush latest DOM input values for team name & leader name
      const nameInput = document.getElementById(`team-${teamId}-name`);
      const leaderInput = document.getElementById(`team-${teamId}-leader`);
      if (nameInput) team.name = nameInput.value;
      if (leaderInput) team.leaderName = leaderInput.value;

      const skillsPerTeam = roomState.settings?.skillsPerTeam || 4;
      const cleanSkills = (team.skills || []).map(s => normalizeSkill(s)).filter(Boolean);

      if (shouldLock) {
        if (!team.name.trim()) team.name = `${team.teamId}팀`;
        if (!team.leaderName.trim()) {
          showToast(`${team.name}의 팀장 이름을 먼저 입력해주세요.`, 'warning');
          return;
        }
        if (cleanSkills.length < skillsPerTeam) {
          showToast(`${team.name}의 필요 역량 ${skillsPerTeam}가지를 모두 태그로 선택해주세요. (현재 ${cleanSkills.length}/${skillsPerTeam}개)`, 'warning');
          return;
        }

        const paddedClean = Array.from({ length: skillsPerTeam }, (_, idx) => cleanSkills[idx] || '');
        try {
          if (debounceTimers[`team_${teamId}`]) clearTimeout(debounceTimers[`team_${teamId}`]);
          await updateDoc(getTeamDocRef(roomState.roomCode, teamId), {
            name: team.name.trim(),
            leaderName: team.leaderName.trim(),
            leaderUid: session.role === 'leader' ? currentUser.uid : (team.leaderUid || ''),
            skills: paddedClean,
            locked: true
          });
          showToast(`${team.name}(팀장: ${team.leaderName.trim()}) 역량이 블라인드 처리되었습니다!`, 'success');
        } catch (err) {
          console.error('Lock team error:', err);
          showToast('블라인드 처리 중 오류가 발생했습니다.', 'warning');
        }
      } else {
        try {
          await updateDoc(getTeamDocRef(roomState.roomCode, teamId), {
            locked: false
          });
          showToast(`${team.name}의 잠금이 해제되었습니다. 태그를 터치해 수정할 수 있습니다.`, 'info');
        } catch (err) {
          console.error('Unlock team error:', err);
        }
      }
    }

      if (!db || !currentUser || !roomState) return;
      try {
        await Promise.all(
          roomTeams.map(t => updateDoc(getTeamDocRef(roomState.roomCode, t.teamId), { locked: false }))

        console.error('Unlock all teams error:', err);
      }
    }

    async function lockAllCompletedTeams() {
      if (!db || !currentUser || !roomState) return;
      let lockedNow = 0;
      const ops = [];
      roomTeams.forEach(t => {
        if (!t.locked && (t.leaderName || '').trim() && (t.skills || []).every(s => normalizeSkill(s))) {
          lockedNow++;
          ops.push(
            updateDoc(getTeamDocRef(roomState.roomCode, t.teamId), {
              skills: t.skills.map(s => normalizeSkill(s)),
              locked: true
            })
          );
        }
      });

      if (lockedNow === 0) {
        showToast('새로 잠금 처리할 완료된 팀이 없습니다. (팀장 이름 및 모든 역량 입력 필요)', 'info');
        return;
      }

      try {
        await Promise.all(ops);
        showToast(`${lockedNow}개 팀의 입력을 블라인드 잠금 처리했습니다.`, 'success');
      } catch (err) {
        console.error('Bulk lock error:', err);
      }
    }

    async function draftApplicant(applicantId) {
      if (!db || !currentUser || !roomState) return;
      const available = getAvailableApplicants();
      if (available.length === 0) return;

      const currentTeam = getCurrentDraftTeam();
      // Permission check: only teacher or the active turn team leader can pick
      if (session.role !== 'teacher' && !(session.role === 'leader' && session.teamId === currentTeam.teamId)) {
        showToast(`현재는 [${currentTeam.name}] 팀장의 선택 차례입니다.`, 'warning');
        return;
      }

      const applicant = available.find(a => a.applicantId === applicantId);
      if (!applicant) return;

      const now = Date.now();
      const nextHistory = [
        ...(roomState.draft?.pickHistory || []),
        {
          teamId: currentTeam.teamId,
          applicantId: applicant.applicantId,
          pickedAt: now
        }
      ];
      const nextActionLog = [
        ...(roomState.draft?.actionLog || []),
        {
          type: 'pick',
          teamId: currentTeam.teamId,
          applicantId: applicant.applicantId,
          at: now
        }
      ];
      const nextTurnIndex = getCurrentDraftTurnIndex() + 1;

      try {
        await updateDoc(getRoomDocRef(roomState.roomCode), {
          'draft.pickHistory': nextHistory,
          'draft.actionLog': nextActionLog,
          'draft.turnIndex': nextTurnIndex,
          'draft.consecutiveSkips': 0,
          updatedAt: now
        });
        const nextTeam = roomTeams.find(t => t.teamId === getTeamIdAtPickIndex(nextTurnIndex));
        showToast(
          `[${currentTeam.name}] ${currentTeam.leaderName || ''} 팀장이 ${applicant.name}(${formatApplicantSkillsText(applicant)}) 학생을 영입했습니다!${nextTeam && available.length > 1 ? ` → 다음 차례: ${nextTeam.name}` : ''}`,
          'success'
        );
      } catch (err) {
        console.error('Draft pick error:', err);
        showToast('선발 처리 중 오류가 발생했습니다.', 'warning');
      }
    }

    async function skipCurrentDraftTurn() {
      if (!db || !currentUser || !roomState) return;
      const available = getAvailableApplicants();
      if (available.length === 0) return;

      const currentTeam = getCurrentDraftTeam();
      if (session.role !== 'teacher' && !(session.role === 'leader' && session.teamId === currentTeam.teamId)) {
        showToast(`현재는 [${currentTeam.name}] 팀장의 차례입니다.`, 'warning');
        return;
      }

      const now = Date.now();
      const nextTurnIndex = getCurrentDraftTurnIndex() + 1;
      const nextConsecutiveSkips = (roomState.draft?.consecutiveSkips || 0) + 1;
      const nextActionLog = [
        ...(roomState.draft?.actionLog || []),
        {
          type: 'skip',
          teamId: currentTeam.teamId,
          at: now
        }
      ];

      try {
        await updateDoc(getRoomDocRef(roomState.roomCode), {
          'draft.turnIndex': nextTurnIndex,
          'draft.consecutiveSkips': nextConsecutiveSkips,
          'draft.actionLog': nextActionLog,
          updatedAt: now
        });
        const nextTeam = roomTeams.find(t => t.teamId === getTeamIdAtPickIndex(nextTurnIndex));
        if (nextConsecutiveSkips >= roomTeams.length) {
          showToast('모든 팀이 스킵하여 자유 선발 라운드로 전환되었습니다! 남은 학생을 역량 무관하게 선택할 수 있습니다.', 'info');
        } else {
          showToast(`[${currentTeam.name}] 팀장이 이번 차례를 스킵했습니다 → 다음 차례: ${nextTeam ? nextTeam.name : ''}`, 'info');
        }
      } catch (err) {
        console.error('Skip turn error:', err);
        showToast('차례 넘기기 중 오류가 발생했습니다.', 'warning');
      }
    }

    async function undoLastDraftPick() {
      if (!db || !currentUser || !roomState) return;
      const actionLog = [...(roomState.draft?.actionLog || [])];
      const history = [...(roomState.draft?.pickHistory || [])];

      if (actionLog.length === 0 && history.length === 0) return;

      const prevTurnIndex = Math.max(0, getCurrentDraftTurnIndex() - 1);

      if (actionLog.length > 0) {
        const lastAction = actionLog.pop();
        if (lastAction.type === 'pick') {
          const idx = history.findIndex(p => p.applicantId === lastAction.applicantId);
          if (idx !== -1) history.splice(idx, 1);
          else history.pop();
        }
        // Recompute trailing consecutive skips
        let trailingSkips = 0;
        for (let i = actionLog.length - 1; i >= 0; i--) {
          if (actionLog[i].type === 'skip') trailingSkips++;
          else break;
        }

        const team = roomTeams.find(t => t.teamId === lastAction.teamId);
        const app = lastAction.applicantId ? roomApplicants.find(a => a.applicantId === lastAction.applicantId) : null;

        try {
          await updateDoc(getRoomDocRef(roomState.roomCode), {
            'draft.pickHistory': history,
            'draft.actionLog': actionLog,
            'draft.turnIndex': prevTurnIndex,
            'draft.consecutiveSkips': trailingSkips,
            updatedAt: Date.now()
          });
          showToast(
            lastAction.type === 'skip'
              ? `직전 스킵 취소: [${team ? team.name : ''}] 팀장의 차례로 되돌려졌습니다.`
              : `직전 선발 취소: ${team ? team.name : ''}의 ${app ? app.name : '학생'} 배정이 되돌려졌습니다.`,
            'info'
          );
        } catch (err) {
          console.error('Undo action error:', err);
        }
        return;
      }

      // Fallback if only pickHistory existed
      const lastPick = history.pop();
      const team = roomTeams.find(t => t.teamId === lastPick.teamId);
      const app = roomApplicants.find(a => a.applicantId === lastPick.applicantId);

      try {
        await updateDoc(getRoomDocRef(roomState.roomCode), {
          'draft.pickHistory': history,
          'draft.turnIndex': prevTurnIndex,
          updatedAt: Date.now()
        });
        showToast(`직전 선발 취소: ${team ? team.name : ''}의 ${app ? app.name : '학생'} 배정이 되돌려졌습니다.`, 'info');
      } catch (err) {
        console.error('Undo pick error:', err);
      }
    }

    /**

     * 10. Step 4 Export & Clipboard Utilities (Safe execCommand Fallback)
     * ============================================================================
     */
    function copyTextFallback(text, successMsg) {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.select();
      try {
        document.execCommand('copy');
        showToast(successMsg, 'success');
      } catch (err) {
        showToast('복사에 실패했습니다. 직접 선택하여 복사해주세요.', 'warning');
      }
      document.body.removeChild(textarea);
    }

    function downloadResultsCSV() {
      if (!roomState) return;
      const rows = [['팀명', '역할', '학생이름', '지원역량1', '지원역량2', '한줄자기어필']];

      roomTeams.forEach(team => {
        rows.push([
          team.name,
          '팀장',
          team.leaderName || '미정',
          (team.skills || []).filter(Boolean).join(' / '),
          '',
          ''
        ]);
        const members = getTeamDraftedMembers(team.teamId);
        members.forEach(m => {
          const sks = getApplicantSkills(m);
          rows.push([team.name, '팀원', m.name, sks[0] || '', sks[1] || '', m.appeal || '']);
        });
      });

      getAvailableApplicants().forEach(u => {
        const sks = getApplicantSkills(u);
        rows.push(['미배정', '대기자', u.name, sks[0] || '', sks[1] || '', u.appeal || '']);
      });

      const csvContent = '\uFEFF' + rows
        .map(row => row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(','))
        .join('\n');

      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `창업마켓_팀구성결과_방${roomState.roomCode}.csv`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
      showToast('엑셀 호환 CSV 파일이 다운로드되었습니다!', 'success');
    }

          connBadge.innerHTML = '⚠️ 오프라인 / 설정 확인 필요';

          connBadge.className = 'inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-extrabold bg-emerald-50 text-emerald-800 border border-emerald-200';

          connBadge.className = 'inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-extrabold bg-emerald-50 text-emerald-800 border border-emerald-200';
          connBadge.innerHTML = '🟢 실시간 동기화 준비됨';
        }
      }

      // If in Lobby or Pending Role Selection
      if (!session.roomCode || !session.role || !roomState) {
        if (stepNavBar) stepNavBar.classList.add('hidden');
        if (headerSummary) {
          headerSummary.textContent = session.pendingRoomCode
            ? `방 코드 [${session.pendingRoomCode}]에 입장했습니다 · 이 iPad의 역할을 선택해주세요`

          headerActions.innerHTML = session.pendingRoomCode

                onclick="leaveRoomToLobby()"

    function renderStepper() {
      const container = document.getElementById('stepper-container');
      if (!container || !roomState) return;

      const isTeacher = session.role === 'teacher';
      const steps = [
        { num: 1, title: '1단계: 팀장 역량 입력', desc: '팀별 역량 입력 & 블라인드' },
        { num: 2, title: '2단계: 블라인드 역량 & 지원', desc: '역량 합산 및 학생 iPad 지원' },
        { num: 3, title: '3단계: 팀장 순번제 드래프트', desc: '턴제 실시간 선발' },
        { num: 4, title: '4단계: 최종 팀 구성 결과', desc: '최종 명단 및 내보내기' }
      ];

      container.innerHTML = steps.map((step, idx) => {
        const isCurrent = roomState.currentStep === step.num;
        const isDone = roomState.currentStep > step.num;

        const badgeClass = isCurrent
          ? 'bg-indigo-600 text-white shadow-xs'
          : isDone
            ? 'bg-emerald-600 text-white'
            : 'bg-slate-200 text-slate-600';

        const cardClass = isCurrent
          ? 'bg-white border-indigo-500 shadow-xs ring-1 ring-indigo-500/20'
          : 'bg-transparent border-transparent ' + (isTeacher ? 'hover:bg-white/80 hover:border-slate-200' : 'opacity-80');

        return `
          <li class="flex-1 flex items-center gap-2">
            <button
              type="button"
              ${isTeacher ? `onclick="goToStep(${step.num})"` : ''}
              class="w-full min-h-[48px] text-left px-3 py-2 rounded-xl border transition flex items-center gap-2.5 ${cardClass} ${isTeacher ? 'cursor-pointer' : 'cursor-default'}"
            >
              <span class="w-7 h-7 rounded-full flex items-center justify-center text-xs font-extrabold shrink-0 ${badgeClass}">
                ${isDone ? '✓' : step.num}
              </span>
              <div class="min-w-0">
                <div class="text-xs sm:text-sm font-extrabold truncate ${isCurrent ? 'text-indigo-700' : 'text-slate-800'}">
                  ${step.title}
                </div>
                <div class="text-[11px] text-slate-500 truncate">${step.desc}</div>
              </div>
            </button>
            ${idx < steps.length - 1 ? '<span class="text-slate-300 font-bold shrink-0">›</span>' : ''}
          </li>
        `;
      }).join('');
    }

    function renderApp() {
      // Avoid destroying an actively typed text field during real-time background sync
      const activeEl = document.activeElement;
      const isActivelyTyping =
        activeEl &&
        (activeEl.tagName === 'INPUT' || activeEl.tagName === 'TEXTAREA') &&
        activeEl.dataset &&
        activeEl.dataset.preserveFocus === 'true';

      updateHeaderAndFooter();

      if (isActivelyTyping) {
        return;
      }

      const main = document.getElementById('app-main');
      if (!main) return;

      if (!session.roomCode) {
        main.innerHTML = renderLobbyView();
        return;
      }

      if (!session.role || !roomState) {
        main.innerHTML = renderRoleSelectionView();
        return;
      }

      switch (roomState.currentStep) {
        case 1:
          main.innerHTML = renderStep1();
          break;
        case 2:
          main.innerHTML = renderStep2();
          break;
        case 3:
          main.innerHTML = renderStep3();
          break;
        case 4:
          main.innerHTML = renderStep4();
          break;
        default:
          main.innerHTML = renderStep1();
      }
    }

    /**

    function renderStep1() {

      const totalRequiredSlots = roomTeams.length * skillsPerTeam;

      return `

                  </button>

                >

                </button>
              </div>
            </div>

            <!-- Reference Pill Bar of the 11 Official Competency Tags -->
            <div class="mt-4 pt-4 border-t border-slate-100 flex flex-wrap items-center gap-1.5">
              <span class="text-xs font-extrabold text-slate-500 mr-1">🏷️ 제공 역량 태그 (${RECOMMENDED_SKILLS.length}종):</span>

    function renderStep1TeamCard(team) {
      const theme = getTeamTheme(team.teamId);
      const skillsPerTeam = roomState?.settings?.skillsPerTeam || (team.skills || []).length || 4;
      const slotIndices = Array.from({ length: skillsPerTeam }, (_, i) => i);
      const selectedSkills = (team.skills || []).map(s => normalizeSkill(s)).filter(Boolean);
      const selectedSet = new Set(selectedSkills);
      const selectedCount = selectedSkills.length;
      const isFull = selectedCount >= skillsPerTeam;
      const isLeaderView = session.role === 'leader';
      const isReadyToLock = (team.leaderName || '').trim().length > 0 && isFull;

      if (team.locked) {
        return `
          <div class="bg-white rounded-2xl border-2 border-emerald-400/80 shadow-xs overflow-hidden flex flex-col justify-between transition">

              <div class="px-5 py-3.5 bg-emerald-50/80 border-b border-emerald-100 flex items-center justify-between gap-2">

            <div class="px-5 py-3.5 bg-slate-50 border-t border-slate-100 flex items-center justify-between gap-2">

                onclick="toggleTeamLock(${team.teamId}, false)"
                class="min-h-[44px] inline-flex items-center gap-1 text-xs font-extrabold text-indigo-700 bg-indigo-50 hover:bg-indigo-100 border border-indigo-200 py-2 px-3.5 rounded-xl transition cursor-pointer"
              >
                <span>🔓</span>
                <span>${isLeaderView ? '내 팀 수정하기 (잠금 해제)' : '수정하기 (잠금 해제)'}</span>

      return `

                  oninput="handleTeamLeaderInput(${team.teamId}, this.value)"

                <div class="flex items-center justify-between">
                  <span class="text-xs font-extrabold text-slate-700">
                    선택된 역량 <span class="${isFull ? 'text-emerald-600' : 'text-indigo-600'}">(${selectedCount} / ${skillsPerTeam})</span>

                  <span class="text-[11px] font-semibold text-slate-400">
                    ${selectedCount > 0 ? '누르면 해제됨' : '아래 태그를 터치하세요'}

                <div class="grid grid-cols-2 gap-2">
                  ${slotIndices.map(idx => {

                        >
                          <span class="truncate"><span class="opacity-75 mr-1">${idx + 1}.</span>${escapeHtml(slotSkill)}</span>

                </div>

                <div class="flex flex-wrap gap-2">
                  ${RECOMMENDED_SKILLS.map(skill => {
                    const isSelected = selectedSet.has(skill);
                    const isDisabled = !isSelected && isFull;

                    if (isSelected) {
                      return `
                        <button
                          type="button"
                          onclick="toggleTeamSkillTag(${team.teamId}, '${escapeHtml(skill)}')"

                      `;

                    if (isDisabled) {
                      return `

                          type="button"

                          <span>${escapeHtml(skill)}</span>

                    return `
                      <button
                        type="button"
                        onclick="toggleTeamSkillTag(${team.teamId}, '${escapeHtml(skill)}')"
                        class="${isLeaderView ? 'min-h-[48px] px-4 py-2.5 text-sm' : 'min-h-[42px] px-3 py-2 text-xs'} rounded-xl font-extrabold bg-white hover:bg-indigo-50 text-slate-800 hover:text-indigo-700 border-2 border-slate-200 hover:border-indigo-300 transition active:scale-95 flex items-center gap-1 cursor-pointer"
                      >
                        <span class="text-indigo-500">+</span>
                        <span>${escapeHtml(skill)}</span>
                      </button>

                  }).join('')}

                ${isFull ? `
                  <p class="text-[11px] font-bold text-emerald-700 bg-emerald-50 border border-emerald-200 rounded-xl px-3 py-2">
                    ✓ ${skillsPerTeam}가지 역량을 모두 선택했습니다! 다른 역량으로 바꾸려면 선택된 역량이나 태그를 다시 눌러 해제하세요.

          <!-- Lock Button Footer (Activated only when leaderName + 4 tags are completed) -->
          <div class="px-5 py-3.5 bg-slate-50 border-t border-slate-100">

              id="team-${team.teamId}-lock-btn"
              type="button"
              ${!isReadyToLock ? 'disabled' : ''}
              onclick="toggleTeamLock(${team.teamId}, true)"
              class="${
                isReadyToLock
                  ? 'w-full min-h-[50px] py-3 px-4 rounded-xl bg-slate-900 hover:bg-indigo-600 text-white text-xs sm:text-sm font-extrabold transition flex items-center justify-center gap-1.5 shadow-xs active:scale-[0.99] cursor-pointer'

              }"
            >
              <span>🔒</span>
              <span>입력 완료 및 블라인드 처리 (${selectedCount}/${skillsPerTeam})</span>
            </button>
          </div>
        </div>
      `;
    }

    /**
     * ============================================================================
     * 14. STEP 2 VIEW: Blind Competency Aggregation & Student iPad Application
     * ============================================================================
     */
    function renderStep2() {
      const aggregated = getAggregatedSkills();
      const validSkillSet = new Set(aggregated.map(a => a.skill));
      const totalDemand = aggregated.reduce((acc, item) => acc + item.demand, 0);
      const teamCount = roomTeams.length || roomState.settings?.teamCount || 6;
      const totalStudents = roomState.settings?.totalStudents || 30;
      const targetApplicants = Math.max(0, totalStudents - teamCount);
      const remainingStudents = Math.max(0, targetApplicants - roomApplicants.length);
      const step1Incomplete = !isStep1Complete();
      const isTeacher = session.role === 'teacher';
      const isLeader = session.role === 'leader';

      // Clean up any stale selected skills if Step 1 changed
      session.selectedApplySkills = session.selectedApplySkills.filter(sk => validSkillSet.has(sk)).slice(0, 2);
      const selectedApplySet = new Set(session.selectedApplySkills);

      const mySubmission = session.myApplicantId
        ? roomApplicants.find(a => a.applicantId === session.myApplicantId)

      return `
        <div class="space-y-6 animate-fade-in">
          ${isTeacher ? `

              <button
                type="button"
                onclick="goToStep(1)"
                class="min-h-[44px] inline-flex items-center gap-1.5 px-4 py-2 rounded-xl text-xs sm:text-sm font-extrabold text-slate-700 bg-slate-100 hover:bg-slate-200 transition cursor-pointer"
              >
                <span>←</span>
                <span>1단계(팀장 역량)로 돌아가 수정하기</span>
              </button>
              <span class="text-xs font-semibold text-slate-500">
                모든 학생 iPad가 실시간으로 2단계 역량 지원 화면을 보고 있습니다.
              </span>
            </div>
          ` : ''}

          ${step1Incomplete ? `
            <div class="rounded-2xl bg-amber-50 border border-amber-300 p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
              <div class="text-xs sm:text-sm text-amber-900 font-bold">
                ⚠️ 아직 1단계에서 일부 팀의 팀장 이름이나 역량이 모두 입력되지 않았습니다.
              </div>
              ${isTeacher ? `
                <button
                  type="button"
                  onclick="goToStep(1)"
                  class="min-h-[44px] px-3.5 py-2 rounded-xl bg-amber-600 hover:bg-amber-700 text-white text-xs font-extrabold shrink-0 cursor-pointer"
                >
                  1단계에서 마저 입력하기 →
                </button>
              ` : ''}
            </div>
          ` : ''}

          <!-- Step 2 Header & Sort Controls -->
          <div class="bg-white rounded-2xl border border-slate-200 p-5 sm:p-6 shadow-xs">
            <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4">
              <div>
                <div class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-indigo-50 text-indigo-700 text-xs font-bold mb-2">
                  <span>2단계 진행 중</span>
                  <span>·</span>
                  <span>팀 정보 100% 블라인드</span>
                </div>
                <h2 class="text-xl sm:text-2xl font-extrabold text-slate-900">
                  전체 팀 요청 역량 합산 결과 &amp; 학생 역량 지원 (2가지 선택)
                </h2>
                <p class="text-sm text-slate-600 mt-1">
                  어느 팀이 어떤 역량을 요청했는지는 비공개입니다. 각자의 iPad에서 자신이 자신 있는 역량을 <strong>2가지</strong> 선택해 지원하세요!
                </p>
              </div>

              <!-- Sort Toggle Buttons (Available to Teacher & Student iPads) -->

                <button
                  type="button"
                  onclick="setStep2Sort('count')"

                    (roomState.step2SortBy || 'count') === 'count'
                      ? 'bg-white text-indigo-700 shadow-xs'
                      : 'text-slate-600 hover:text-slate-900'

                  📊 모집 수요 많은순

                <button
                  type="button"
                  onclick="setStep2Sort('alpha')"

                    roomState.step2SortBy === 'alpha'
                      ? 'bg-white text-indigo-700 shadow-xs'
                      : 'text-slate-600 hover:text-slate-900'

                  🔤 가나다순
                </button>
              </div>
            </div>

            <!-- Blind Aggregated Competency Cards -->
            <div class="mt-6">
              <div class="flex items-center justify-between text-xs font-bold text-slate-500 mb-3">
                <span>총 ${aggregated.length}종류 역량 · 전체 수요 합계 ${totalDemand}자리 ${!isLeader ? `(카드를 터치해 최대 2가지 선택 · 현재 ${session.selectedApplySkills.length}/2개 선택됨)` : ''}</span>

                <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3.5">

                    const selectOrder = session.selectedApplySkills.indexOf(item.skill) + 1;
                    const ratioPct = Math.min(100, Math.round((item.applicantCount / Math.max(1, item.demand)) * 100));

                      <button

                        </div>

                        <div>
                          <div class="flex items-center justify-between text-xs font-bold mb-1.5">
                            <span class="${isFilled ? 'text-emerald-600' : 'text-slate-500'}">

                            <span class="text-slate-400">
                              ${isFilled ? '충족됨' : `${item.demand - item.applicantCount}명 여유`}
                            </span>
                          </div>
                          <div class="w-full h-2 bg-slate-100 rounded-full overflow-hidden">
                            <div class="h-full rounded-full transition-all duration-300 ${isFilled ? 'bg-emerald-500' : 'bg-indigo-500'}" style="width: ${ratioPct}%"></div>
                          </div>
                        </div>
                      </button>
                    `;
                  }).join('')}
                </div>
              `}
            </div>
          </div>

          <!-- Student Application Form & Registered List -->
          <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <!-- Left: Application Form (5 cols) -->
            <div class="lg:col-span-5">
              ${isLeader ? `
                <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-xs space-y-3">
                  <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-indigo-50 text-indigo-700 text-xs font-extrabold">
                    👑 팀장 관전 화면
                  </div>
                  <h3 class="text-lg font-extrabold text-slate-900">학생들이 역량 2가지를 선택해 지원하고 있습니다</h3>
                  <p class="text-xs sm:text-sm text-slate-600 leading-relaxed">
                    오른쪽 목록에서 실시간으로 등록되는 지원자들을 확인해보세요. 선생님이 <strong>3단계 드래프트</strong>를 시작하면 팀장 순서대로 지명할 수 있습니다!
                  </p>
                </div>
              ` : (session.role === 'student' && mySubmission) ? `
                <!-- Student iPad: Already Submitted Card with Quick Edit -->
                <div class="bg-white rounded-2xl border-2 border-emerald-400 p-5 sm:p-6 shadow-xs space-y-4">
                  <div class="flex items-center justify-between border-b border-emerald-100 pb-3">
                    <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-emerald-600 text-white text-xs font-extrabold">
                      ✓ 내 지원서 제출 완료
                    </span>
                    <span class="text-xs font-bold text-slate-500">실시간 반영됨</span>
                  </div>

                  <div class="bg-emerald-50/70 rounded-2xl p-4 border border-emerald-200 space-y-2.5">
                    <div class="flex items-center justify-between gap-2 flex-wrap">
                      <span class="text-lg font-black text-slate-900">${escapeHtml(mySubmission.name)}</span>
                      <div class="flex flex-wrap gap-1.5">
                        ${getApplicantSkills(mySubmission).map(sk => `
                          <span class="px-2.5 py-1 rounded-xl bg-indigo-600 text-white text-xs font-extrabold">${escapeHtml(sk)}</span>
                        `).join('')}
                      </div>
                    </div>
                    <p class="text-xs sm:text-sm text-slate-700">
                      ${mySubmission.appeal ? `"${escapeHtml(mySubmission.appeal)}"` : '<span class="text-slate-400 italic">한줄 자기어필 없음</span>'}
                    </p>
                  </div>

                  <p class="text-xs text-slate-500">
                    2단계가 진행되는 동안에는 언제든 지원 역량(2가지)이나 한줄 어필을 수정할 수 있습니다.
                  </p>

                  <div class="flex items-center gap-2">
                    <button
                      type="button"
                      onclick="startEditApplicant('${escapeHtml(mySubmission.applicantId)}')"
                      class="flex-1 min-h-[48px] px-4 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs sm:text-sm font-extrabold transition cursor-pointer"
                    >
                      ✏️ 내 지원서 수정하기
                    </button>
                    <button
                      type="button"
                      onclick="removeApplicant('${escapeHtml(mySubmission.applicantId)}')"
                      class="min-h-[48px] px-4 py-3 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200 text-xs sm:text-sm font-bold transition cursor-pointer"
                    >
                      🗑️ 취소
                    </button>
                  </div>
                </div>
              ` : `
                <!-- Student / Teacher Application Form (2-Skill Tag Picker) -->
                <form onsubmit="handleStudentApply(event)" class="bg-white rounded-2xl border border-slate-200 p-5 sm:p-6 shadow-xs sticky top-36 space-y-4">
                  <div class="flex items-center justify-between border-b border-slate-100 pb-3.5">
                    <h3 class="text-lg font-extrabold text-slate-900">
                      ${isTeacher ? '🙋‍♂️ 학생 역량 대리 지원 등록' : '🙋‍♂️ 내 역량 지원서 작성'}
                    </h3>
                    <span class="px-2.5 py-1 rounded-full text-xs font-bold ${
                      remainingStudents === 0 ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'
                    }">
                      미지원 남은 인원: ${remainingStudents}명
                    </span>
                  </div>

                  <!-- 2-Skill Selection Slots & Tag Buttons -->
                  <div class="space-y-2.5">
                    <div class="flex items-center justify-between">
                      <label class="block text-xs font-extrabold text-slate-700">
                        1. 내가 지원할 역량 선택 <span class="text-indigo-600">(${session.selectedApplySkills.length} / 2가지)</span> *
                      </label>
                      <span class="text-[11px] font-semibold text-slate-400">최대 2가지 선택</span>
                    </div>

                    <!-- Selected 2 Slots Preview -->
                    <div class="grid grid-cols-2 gap-2">
                      ${[0, 1].map(idx => {
                        const chosen = session.selectedApplySkills[idx];
                        if (chosen) {
                          return `
                            <button
                              type="button"
                              onclick="toggleSkillForApplication('${escapeHtml(chosen)}')"
                              class="min-h-[42px] px-3 py-2 rounded-xl bg-indigo-600 hover:bg-rose-600 text-white text-xs font-extrabold flex items-center justify-between gap-1 transition cursor-pointer"
                            >
                              <span class="truncate">${idx + 1}. ${escapeHtml(chosen)}</span>
                              <span class="font-black">×</span>
                            </button>
                          `;
                        }
                        return `
                          <div class="min-h-[42px] px-3 py-2 rounded-xl border-2 border-dashed border-slate-300 bg-slate-50 text-slate-400 text-xs font-bold flex items-center justify-center">
                            ${idx + 1}번째 역량 미선택
                          </div>
                        `;
                      }).join('')}
                    </div>

                    <!-- Tag Palette from Aggregated Skills -->
                    <div class="flex flex-wrap gap-1.5 pt-1">
                      ${aggregated.map(item => {
                        const isPicked = selectedApplySet.has(item.skill);
                        const isFull = !isPicked && session.selectedApplySkills.length >= 2;
                        return `
                          <button
                            type="button"
                            ${isFull ? 'disabled' : ''}
                            onclick="toggleSkillForApplication('${escapeHtml(item.skill)}')"
                            class="min-h-[40px] px-3 py-1.5 rounded-xl text-xs font-extrabold border transition cursor-pointer ${
                              isPicked
                                ? 'bg-indigo-600 text-white border-indigo-600 shadow-2xs'
                                : isFull
                                  ? 'bg-slate-100 text-slate-400 border-slate-200 opacity-50 cursor-not-allowed'
                                  : 'bg-white hover:bg-indigo-50 text-slate-800 border-slate-200 hover:border-indigo-300'

                    <label for="apply-student-name" class="block text-xs font-bold text-slate-700 mb-1.5">2. 학생 이름 *</label>

                      id="apply-student-name"
                      data-preserve-focus="true"
                      type="text"
                      required
                      placeholder="본인 이름을 입력하세요 (예: 이서연)"
                      class="w-full min-h-[48px] px-3.5 py-3 rounded-xl border border-slate-300 text-sm font-bold text-slate-900 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    />
                  </div>

                  <div>
                    <label for="apply-student-appeal" class="block text-xs font-bold text-slate-700 mb-1.5">3. 한줄 자기어필 (선택사항)</label>
                    <input
                      id="apply-student-appeal"
                      data-preserve-focus="true"
                      type="text"
                      maxlength="60"
                      placeholder="예: 홍보 포스터 디자인과 손님 응대 자신 있습니다!"
                      class="w-full min-h-[48px] px-3.5 py-3 rounded-xl border border-slate-300 text-sm text-slate-800 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    />
                  </div>

                  <button
                    type="submit"
                    ${aggregated.length === 0 || session.selectedApplySkills.length === 0 ? 'disabled' : ''}
                    class="w-full min-h-[52px] py-3.5 px-5 rounded-xl font-extrabold text-sm sm:text-base transition ${
                      aggregated.length === 0 || session.selectedApplySkills.length === 0
                        ? 'bg-slate-200 text-slate-400 cursor-not-allowed'
                        : 'bg-indigo-600 hover:bg-indigo-700 text-white shadow-md shadow-indigo-200 active:scale-[0.99] cursor-pointer'
                    }"
                  >
                    ✨ 역량 지원 제출하기 (${session.selectedApplySkills.length}/2개 선택됨)

            </div>

            <!-- Right: Registered Applicants List (7 cols) -->
            <div class="lg:col-span-7">
              <div class="bg-white rounded-2xl border border-slate-200 p-5 sm:p-6 shadow-xs">
